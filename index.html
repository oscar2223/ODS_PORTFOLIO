  <style>
    :root {
      --bg-color: #080808;
      --text-color: #eaeaea;
      --accent-color: #8c8c8c;
      --font-serif: 'Playfair Display', serif;
      --font-body: 'Cormorant Garamond', serif;
      --font-ui: 'Manrope', sans-serif;
    }

    /* --- Base Reset & Style --- */
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; height: 100%; }
    
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-body);
      overflow-x: hidden;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; transition: opacity 0.3s; }

    /* --- Noise Overlay --- */
    .noise-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* --- Header --- */
    header.site-header {
      position: fixed;
      top: 0; width: 100%; padding: 25px 4vw;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 100; mix-blend-mode: difference;
    }
    .logo-text { font-weight: 700; font-family: var(--font-ui); letter-spacing: 2px; color: #fff; font-size: 1.2rem; }

    .nav { display: flex; gap: 35px; }
    .nav a {
      color: #fff; font-family: var(--font-ui); font-size: 13px;
      text-transform: uppercase; letter-spacing: 1.5px;
      opacity: 0.7; position: relative;
    }
    .nav a:hover, .nav a.active { opacity: 1; }
    .nav a::after {
      content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 1px;
      background: #fff; transition: width 0.3s ease;
    }
    .nav a:hover::after { width: 100%; }

    /* --- Hero Section --- */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 4vw;
      margin-top: 60px;
    }

    .hero h1 {
      font-family: var(--font-serif);
      font-size: clamp(40px, 8vw, 100px);
      line-height: 0.9;
      margin: 0;
      font-weight: 400;
      letter-spacing: -2px;
    }

    .hero h1 span {
      display: block;
      font-style: italic;
      color: var(--accent-color);
      font-size: 0.5em;
      margin-top: 10px;
      letter-spacing: 0;
    }

    .typing-container {
      font-family: var(--font-ui);
      font-size: clamp(16px, 2vw, 22px);
      margin-top: 30px;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 4px;
      min-height: 1.5em;
    }

    #typing-text { color: #fff; border-right: 2px solid #fff; padding-right: 5px; animation: blink 0.7s infinite; }
    @keyframes blink { 50% { border-color: transparent; } }

    /* --- Social Icons --- */
    .social-links {
      display: flex;
      gap: 25px;
      margin-top: 50px;
    }
    .social-links a {
      opacity: 0.6;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .social-links a:hover {
      opacity: 1;
      transform: translateY(-5px);
    }
    .social-links svg {
      width: 24px;
      height: 24px;
      fill: #fff;
    }

    /* --- Footer --- */
    footer {
      padding: 40px 4vw;
      display: flex;
      justify-content: space-between;
      font-family: var(--font-ui);
      font-size: 11px;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* --- Mobile --- */
    @media (max-width: 768px) {
      .nav { display: none; } /* On pourrait ajouter un menu burger plus tard */
      .hero h1 { font-size: 60px; }
    }
  </style>
</head>

  <script>
    // --- Animation au Scroll ---
    document.addEventListener("DOMContentLoaded", function() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) entry.target.classList.add('visible');
        });
      }, { threshold: 0.1 });
      document.querySelectorAll('.js-scroll').forEach(el => observer.observe(el));
    });

    // --- Typing Effect ---
    const textElement = document.getElementById('typing-text');
    const words = ["digitales.", "interactives.", "créatives."];
    let wordIndex = 0;
    let charIndex = 0;
    let isDeleting = false;

    function type() {
      const currentWord = words[wordIndex];
      if (isDeleting) {
        textElement.textContent = currentWord.substring(0, charIndex - 1);
        charIndex--;
      } else {
        textElement.textContent = currentWord.substring(0, charIndex + 1);
        charIndex++;
      }

      let typeSpeed = isDeleting ? 50 : 150;

      if (!isDeleting && charIndex === currentWord.length) {
        isDeleting = true;
        typeSpeed = 2000; // Pause avant effacement
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        wordIndex = (wordIndex + 1) % words.length;
        typeSpeed = 500;
      }

      setTimeout(type, typeSpeed);
    }

    document.addEventListener('DOMContentLoaded', type);
  </script>
